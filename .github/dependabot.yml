# Dependabot configuration
#
# Conductor was split out of the eventuras repo, whose Dependabot setup covered
# it until then. This mirrors the eventuras and origo setup. The 10-day
# supply-chain window is enforced in two places that mirror each other:
#   - here, via `cooldown.default-days: 10` (Dependabot won't open a PR for a
#     version until it has been published for 10 days), and
#   - at install time, via `minimumReleaseAge` in pnpm-workspace.yaml.
# First-party @eventuras/@losol packages are excluded from the wait.
#
# Security updates run as a separate mechanism (Dependabot security updates,
# enabled in repo settings) and are NOT subject to the cooldown below.
#
# Dependabot PRs carry no changeset, so a bump to a published package's
# runtime dependencies would be merged but never released.
# .github/workflows/dependabot-changeset.yml adds the missing changeset.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm / pnpm workspace
  # A single root pnpm-lock.yaml covers apps/* and packages/*, so one entry at
  # "/" updates dependencies across the whole workspace.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # packages/* are published libraries. Leave a range alone while it already
    # admits the new version (only the lockfile moves) and raise it only when
    # it must, so in-range bumps neither force a release nor push consumers
    # onto a newer minimum than they need.
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 10
      exclude:
        # First-party packages are trusted — no 10-day wait. Mirrors
        # `minimumReleaseAgeExclude: '@eventuras/*'` in pnpm-workspace.yaml.
        - "@eventuras/*"
        - "@losol/*"
    ignore:
      # Node LTS lines are even majors; the engines field pins Node 24. Move
      # @types/node to the next LTS by hand together with .nvmrc, engines and
      # the Dockerfile base image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Order matters: a dependency joins the FIRST group it matches.
      # Keep the specific groups above the catch-all minor/patch group.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
      # Everything else: bundle all remaining minor + patch bumps into one PR.
      # Ungrouped major bumps still open as individual PRs.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # Actions are SHA-pinned with a trailing semver comment; Dependabot keeps both
  # the SHA and the comment in sync. Low churn — monthly is plenty.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Docker base images
  # The base image is pinned by digest, so Dependabot bumps the digest when the
  # node:24-bookworm-slim tag is rebuilt (Node patch releases, Debian fixes).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/apps/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 10
    ignore:
      # Node LTS lines are even majors (24, 26, …); odd majors (25, 27, …) are
      # never promoted to LTS. Dependabot can't tell LTS from Current, so ignore
      # ALL node major bumps and move to the next LTS by hand when it ships.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"
