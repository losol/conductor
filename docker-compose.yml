services:
  conductor:
    build:
      # The Dockerfile prunes the monorepo with turbo, so the context is the
      # repository root, not the app directory.
      context: .
      dockerfile: apps/conductor/Dockerfile
    ports:
      - "3333:3333"
    volumes:
      # Persist the runtime config. This is the same directory `pnpm dev`
      # writes to, so a local setup carries over into the container.
      - ./apps/conductor/data/config:/app/data/config
    environment:
      - NODE_ENV=production
      - PORT=3333
    restart: unless-stopped
